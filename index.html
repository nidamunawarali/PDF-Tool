<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <!-- Font Awesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title>Pdf Tool - Project 1</title>
</head>
<style>
    body {
        background-color: rgb(24, 4, 73);
        color: white;
    }

    .navbar-brand {
        color: white !important;
        font-weight: bold;
        font-size: 24px;
    }

    .nav-link {
        color: white !important;
    }

    .merge {
        text-align: center;
        margin-top: 80px;
        background-color: rgb(38, 15, 91);
        padding: 50px;
        border-radius: 15px;
    }

    .merge h2 {
        font-weight: bold;
        margin-bottom: 30px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .form-group input[type="file"] {
        width: fit-content !important;
        margin: 10px auto;
    }

    .btn-primary {
        padding: 10px 30px;
        border-radius: 8px;
    }
</style>

<body>

    <!-- --------------------------------Navbar------------------------------------------ -->
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" href="#"><i class="fa-solid fa-file-pdf"></i>PDFX</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Link</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                        data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Dropdown
                    </a>
                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" href="#">Action</a>
                        <a class="dropdown-item" href="#">Another action</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#">Something else here</a>
                    </div>
                </li>
            </ul>

        </div>
    </nav>


    <!-- ---------------------Merge PDF------------------------ -->
    <div class="container my-3">
        <div class="row ">
            <div class="merge col-12">
                <h2>Merge Your PDFs Easily</h2>
                <form method="post" action="/merge" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="exampleFormControlFile1">Combine multiple PDF files into one document.</label>
                        <input type="file" name="pdfs" class="inputFile my-3" id="exampleFormControlFile1" multiple
                            accept=".pdf">
                        <button class="btn btn-primary my-3" type="submit">Merge PDFs
                            <i class="fa-sharp fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
</body>

</html>
